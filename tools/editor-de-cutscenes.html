<title>Editor de Cutscenes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Mesa de edição de filme: viewport no centro, cenas à esquerda, inspetor à direita, linha do tempo embaixo. */
:root {
  --bg: #0e0c11;
  --panel: #16131b;
  --panel2: #1d1924;
  --line: #2c2735;
  --fg: #ece6f2;
  --muted: #9a90a8;
  --cam: #f2b134;
  --usr: #ff6a55;
  --alv: #3fc8b5;
  --cut: #8f1f2c;
  --leg: #b9a6ff;
  --accent: #f2b134;
  --danger: #ff5a6a;
  --display: "Saira Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 13px; overflow: hidden; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button, select, input, textarea { font: inherit; color: inherit; }
button { background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 5px 10px; cursor: pointer; }
button:hover { border-color: #4a4257; }
button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
button.primary { background: var(--accent); color: #1a1205; border-color: var(--accent); font-weight: 600; }
button.on { border-color: var(--accent); color: var(--accent); }
button.danger { color: var(--danger); }
select { min-width: 0; width: 100%; }
#speed { width: auto; }
select, input[type=number], input[type=text], textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px; }
input[type=number] { width: 100%; font-family: var(--mono); font-variant-numeric: tabular-nums; }
input[type=range] { width: 100%; accent-color: var(--accent); }
label { color: var(--muted); }

.app { height: 100%; display: grid; grid-template-rows: auto 1fr auto; padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
header { display: flex; align-items: center; gap: 14px; padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
.brand { font-family: var(--display); font-weight: 700; font-size: 20px; letter-spacing: 0.04em; text-transform: uppercase; display: flex; align-items: baseline; gap: 8px; }
.brand small { font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: 0; text-transform: none; font-weight: 400; }
header .spacer { flex: 1; }
header .group { display: flex; gap: 6px; flex-wrap: wrap; }

.main { display: grid; grid-template-columns: 230px minmax(0, 1fr) 290px; min-height: 0; }
aside { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; min-height: 0; }
aside.right { border-right: 0; border-left: 1px solid var(--line); }
.sec { padding: 12px 14px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.sec h3 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.skill { display: grid; gap: 2px; text-align: left; width: 100%; padding: 8px 10px; background: transparent; border: 1px solid transparent; }
.skill b { font-weight: 600; font-size: 13px; }
.skill span { font-size: 11px; color: var(--muted); }
.skill.sel { background: var(--panel2); border-color: var(--line); box-shadow: inset 3px 0 0 var(--accent); }
.skill .mod { font-family: var(--mono); font-size: 10px; color: var(--accent); }
.row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.field { display: grid; gap: 3px; min-width: 0; }
.field > label { font-size: 11px; }
.slider { display: grid; grid-template-columns: 74px 1fr 70px; gap: 6px; align-items: center; }
.slider label { font-size: 11px; }
.check { display: flex; align-items: center; gap: 8px; color: var(--fg); }
.hint { color: var(--muted); font-size: 12px; line-height: 1.45; margin: 0; }
.hint b { color: var(--fg); font-weight: 500; }
.kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 3px; padding: 0 4px; color: var(--fg); }

.stage { position: relative; min-width: 0; min-height: 0; background: #07060a; }
.stage canvas { display: block; width: 100%; height: 100%; }
.overlay { position: absolute; inset: 0; pointer-events: none; }
.bar { position: absolute; left: 0; right: 0; background: #000; height: 0; }
.bar.top { top: 0; } .bar.bot { bottom: 0; }
.subtitle { position: absolute; left: 0; right: 0; text-align: center; font-family: "Minecraft", var(--body); font-weight: 600; color: #fff; text-shadow: 2px 2px 0 #3f3f3f; white-space: pre; }
.viewtabs { position: absolute; top: 10px; left: 10px; display: flex; gap: 4px; pointer-events: auto; flex-wrap: wrap; max-width: calc(100% - 20px); }
.viewtabs button { background: rgba(14, 12, 17, 0.82); backdrop-filter: blur(4px); }
.readout { position: absolute; right: 10px; top: 10px; font-family: var(--mono); font-size: 11px; color: var(--muted); background: rgba(14, 12, 17, 0.82); border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; line-height: 1.5; white-space: pre; pointer-events: none; }
.tag { position: absolute; left: 10px; bottom: 10px; font-family: var(--display); letter-spacing: 0.1em; text-transform: uppercase; font-size: 12px; padding: 3px 8px; border-radius: 3px; background: rgba(14, 12, 17, 0.82); border: 1px solid var(--line); }
.tag.live { color: var(--cam); border-color: var(--cam); }
.pip-label { position: absolute; font-family: var(--display); letter-spacing: 0.1em; text-transform: uppercase; font-size: 11px; color: var(--cam); }
.flash { position: absolute; inset: 0; background: #fff; opacity: 0; }

footer { border-top: 1px solid var(--line); background: var(--panel); display: grid; grid-template-rows: auto 1fr; height: 252px; min-height: 0; }
.transport { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.time { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 13px; min-width: 150px; }
.time b { color: var(--accent); font-weight: 500; }
.tlwrap { position: relative; min-height: 0; display: grid; grid-template-columns: 112px minmax(0, 1fr); }
.tlnames { border-right: 1px solid var(--line); display: grid; align-content: start; }
.tlnames div { height: 30px; display: flex; align-items: center; padding: 0 10px; font-family: var(--display); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid #221e29; gap: 6px; }
.tlnames div:first-child { height: 24px; }
.tlnames i { width: 8px; height: 8px; transform: rotate(45deg); display: inline-block; }
#tl { width: 100%; height: 100%; display: block; cursor: default; }
.tlscroll { overflow: hidden; min-width: 0; position: relative; }

.modal { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6); display: grid; place-items: center; padding: 16px; z-index: 20; }
.modal .box { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; width: min(760px, 100%); max-height: calc(100% - 32px); display: grid; grid-template-rows: auto 1fr auto; overflow: hidden; }
.modal .box > div { padding: 12px 16px; }
.modal h2 { margin: 0; font-family: var(--display); font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; font-size: 18px; }
.modal textarea { width: 100%; height: 340px; font-family: var(--mono); font-size: 11px; resize: vertical; }
.modal .actions { display: flex; gap: 8px; justify-content: flex-end; border-top: 1px solid var(--line); flex-wrap: wrap; }
.path { font-family: var(--mono); font-size: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; user-select: all; overflow-x: auto; white-space: nowrap; }
.toast { position: fixed; left: 50%; bottom: 270px; transform: translateX(-50%); background: var(--panel2); border: 1px solid var(--accent); color: var(--fg); padding: 8px 14px; border-radius: 4px; z-index: 30; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
.toast.show { opacity: 1; }
.events { display: grid; gap: 2px; font-size: 12px; }
.events div { display: grid; grid-template-columns: 44px 1fr; gap: 6px; color: var(--muted); }
.events div b { font-family: var(--mono); font-weight: 400; color: var(--fg); font-variant-numeric: tabular-nums; }

@media (max-width: 980px) {
  body { overflow: auto; }
  .app { height: auto; }
  .main { grid-template-columns: 1fr; }
  aside { border-right: 0; border-bottom: 1px solid var(--line); max-height: none; }
  .stage { height: 56vh; }
  aside.left .sec.skills { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
}
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>

<div class="app">

  <div class="main">

      <div class="tlnames" id="tlnames"></div>

</div>

<div class="modal" id="modal" hidden><div class="box"><div id="mHead"></div><div id="mBody" style="overflow:auto"></div><div class="actions" id="mActs"></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/TransformControls.js"></script>
<script>
"use strict";
// ======================================================================================================
// Matemática compartilhada com o mod (client/cutscene/CutscenePlayer.java). Mudou aqui, muda lá.
// Espaço da cena: x pra esquerda, y pra cima, z pra frente (de quem usa pro alvo), em blocos, a partir dos pés
// da "origem" no começo. Tempo em ticks (20 por segundo) desde que o mod começa a cutscene da skill.
// ======================================================================================================
const D2R = Math.PI / 180, R2D = 180 / Math.PI;
const EYE = 1.62, DEFAULT_FOV = 70, AIM_H = 1.5, BAR_H = 0.11;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const smooth = x => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
const wrapDeg = a => { a = a % 360; if (a >= 180) a -= 360; if (a < -180) a += 360; return a; };
const v3 = (x = 0, y = 0, z = 0) => [x, y, z];
const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const mul = (a, k) => [a[0] * k, a[1] * k, a[2] * k];
const vlerp = (a, b, k) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)];
const len = a => Math.hypot(a[0], a[1], a[2]);
function ease(type, x) {
  x = clamp(x, 0, 1);
  switch (type) {
    case "linear": return x;
    case "entrada": return x * x * x;
    case "saida": return 1 - Math.pow(1 - x, 3);
    case "corte": return x >= 1 ? 1 : 0;
    default: return smooth(x);
  }
}
const catmull = (p0, p1, p2, p3, u) => { const u2 = u * u, u3 = u2 * u; return 0.5 * (2 * p1 + (-p0 + p2) * u + (2 * p0 - 5 * p1 + 4 * p2 - p3) * u2 + (-p0 + 3 * p1 - 3 * p2 + p3) * u3); };
function segmentIndex(keys, t) { let i = 0; while (i + 1 < keys.length && keys[i + 1].t <= t) i++; return i; }
function curve(keys, t, values, angle) {
  const n = keys.length;
  if (n === 1 || t <= keys[0].t) return values(keys[0]);
  if (t >= keys[n - 1].t) return values(keys[n - 1]);
  const i = segmentIndex(keys, t), a = keys[i], b = keys[i + 1];
  const span = b.t - a.t, u = span <= 0 ? 1 : ease(a.suave, (t - a.t) / span);
  const p1 = values(a), p2 = values(b);
  let p0 = i > 0 ? values(keys[i - 1]) : p1, p3 = i + 2 < n ? values(keys[i + 2]) : p2;
  if (a.suave === "corte") return p1;
  if (i > 0 && keys[i - 1].suave === "corte") p0 = p1;
  if (b.suave === "corte") p3 = p2;
  return p1.map((v1, c) => {
    let v0 = p0[c], v2 = p2[c], v3_ = p3[c];
    if (angle[c]) { v0 = v1 + wrapDeg(v0 - v1); v2 = v1 + wrapDeg(v2 - v1); v3_ = v2 + wrapDeg(v3_ - v2); }
    return catmull(v0, v1, v2, v3_, u);
  });
}
function weight(doc, t) {
  let best = 0;
  for (const s of doc.trechos) {
    let w = 0;
    if (t >= s.inicio && t <= s.fim) w = s.entradaTicks > 0 ? smooth((t - s.inicio) / s.entradaTicks) : 1;
    else if (t > s.fim && s.saidaTicks > 0 && t < s.fim + s.saidaTicks) w = 1 - smooth((t - s.fim) / s.saidaTicks);
    best = Math.max(best, w);
  }
  return best;
}
const ZERO_POSE = () => ({ cabeca: 0, tronco: 0, bracoDir: { frente: 0, abrir: 0 }, bracoEsq: { frente: 0, abrir: 0 }, giro: 0, pernaDir: { frente: 0, abrir: 0 }, pernaEsq: { frente: 0, abrir: 0 }, corpo: 0, pernas: 0 });
const BR = b => ({ frente: (b && b.frente) || 0, abrir: (b && b.abrir) || 0 });
function poseLerp(a, b, k) {
  a = a || ZERO_POSE(); b = b || ZERO_POSE();
  const br = (x, y) => ({ frente: lerp(BR(x).frente, BR(y).frente, k), abrir: lerp(BR(x).abrir, BR(y).abrir, k) });
  return { cabeca: lerp(a.cabeca || 0, b.cabeca || 0, k), tronco: lerp(a.tronco || 0, b.tronco || 0, k), bracoDir: br(a.bracoDir, b.bracoDir), bracoEsq: br(a.bracoEsq, b.bracoEsq),
    giro: lerp(a.giro || 0, b.giro || 0, k), pernaDir: br(a.pernaDir, b.pernaDir), pernaEsq: br(a.pernaEsq, b.pernaEsq), corpo: lerp(a.corpo || 0, b.corpo || 0, k), pernas: lerp(a.pernas || 0, b.pernas || 0, k) };
}
function posePlus(a, b) {
  const br = (x, y) => ({ frente: BR(x).frente + BR(y).frente, abrir: BR(x).abrir + BR(y).abrir });
  return { cabeca: (a.cabeca || 0) + (b.cabeca || 0), tronco: (a.tronco || 0) + (b.tronco || 0), bracoDir: br(a.bracoDir, b.bracoDir), bracoEsq: br(a.bracoEsq, b.bracoEsq),
    giro: (a.giro || 0) + (b.giro || 0), pernaDir: br(a.pernaDir, b.pernaDir), pernaEsq: br(a.pernaEsq, b.pernaEsq), corpo: (a.corpo || 0) + (b.corpo || 0), pernas: (a.pernas || 0) + (b.pernas || 0) };
}
function actorState(doc, name, t) {
  const actor = doc.atores[name];
  const keys = actor ? actor.chaves : [];
  if (!keys.length || t < keys[0].t || t > keys[keys.length - 1].t) return null;
  const v = curve(keys, t, k => [k.pos[0], k.pos[1], k.pos[2], k.giro], [false, false, false, true]);
  const i = segmentIndex(keys, t), a = keys[i], b = keys[Math.min(i + 1, keys.length - 1)];
  const span = b.t - a.t, u = span <= 0 ? 0 : ease(a.suave, (t - a.t) / span);
  return { off: [v[0], v[1], v[2]], giro: v[3], pose: poseLerp(a.pose, b.pose, u), replace: actor.modo === "substituir" };
}

// ======================================================================================================
// As skills que têm cutscene no mod. base(t): o que a skill faz com os personagens (aproximado, só pra prévia; isso
// NÃO vai no JSON). original(t): a câmera que o mod usa hoje, portada dos arquivos client/*Cutscene.java.
// Tudo em "espaço do usuário": pés de quem usa no começo, z pro alvo.
// ======================================================================================================
const F = v3(0, 0, 1), LEFT = v3(1, 0, 0), RIGHT = v3(-1, 0, 0);
const rest = (p, yaw = 0, extra = {}) => Object.assign({ p, yaw, pose: ZERO_POSE(), vis: true }, extra);
const P = o => posePlus(ZERO_POSE(), o);
function holdPose(t, keys) { // keys: [[t, pose]] com transição suave de 3 ticks
  let cur = ZERO_POSE(), from = ZERO_POSE(), at = -1e9;
  for (const [kt, pose] of keys) { if (t >= kt) { from = cur; cur = pose; at = kt; } }
  return poseLerp(from, cur, smooth((t - at) / 3));
}

function faceSkill(o) {
  return {
    nome: o.nome, poder: "Madara", dur: o.dur, alvo: true, origem: "usuario", viewer: "usuario", travar: true,
    gancho: o.gancho,
    events: [[0, "Começa (todo mundo congela)"], [o.zoom, "Fim do zoom no rosto"], [o.part, "Partículas"], [o.dur - o.back, "Volta pra visão"], [o.freeze, "Fim do congelamento"]].filter(e => e[0] <= o.dur),
    base: t => ({ usuario: rest(v3(0, 0, 0), 0, { pose: holdPose(t, [[0, P({ cabeca: -4 })]]) }), alvo: rest(v3(0, 0, 5), 180) }),
    original: t => {
      const k = smooth(t / o.zoom), d = lerp(o.d0, o.d1, k);
      return { pos: v3(0, EYE + o.alt, d), look: v3(0, EYE, 0) };
    },
    trechos: [{ nome: "Rosto", inicio: 0, fim: o.dur - o.back, entradaTicks: 0, saidaTicks: o.back }],
    cuts: [], legendas: [], note: o.note,
    fx: (t, F) => { F.eyes("usuario", t >= o.part - 2 && t < o.dur ? 1 : 0, 0xff1a1a); }
  };
}

const SK = {
  "madara.mangekyo": faceSkill({ nome: "Mangekyo", dur: 50, zoom: 19, back: 15, part: 20, d0: 3, d1: 0.6, alt: 0.05, freeze: 40,
    gancho: "Quando o Madara usa o Mangekyo (tecla da skill).",
    note: "A cutscene aparece pro Madara e pra quem foi pego. O \"alvo\" aqui é quem está assistindo; quando é o próprio Madara vendo, não tem alvo e o alvo vira ele mesmo." }),
  "madara.izanami": faceSkill({ nome: "Izanami", dur: 50, zoom: 19, back: 12, part: 22, d0: 3, d1: 0.55, alt: 0.05, freeze: 50,
    gancho: "Quando o Izanami volta o tempo (a hora do rosto).",
    note: "Mesmo esquema do Mangekyo: começa no momento em que o tempo volta. O alvo é quem está assistindo." }),
  "madara.susanoo": {

    const z = $("b_zeroPose"); if (z) z.onclick = () => { pushUndo(); k.pose = ZERO_POSE(); save(); renderInspector(); };
  } else if (S.sel.track === "trecho") {
    on("s_nome", el => k.nome = el.value);
    on("s_inicio", el => k.inicio = Math.max(0, +el.value)); on("s_fim", el => k.fim = Math.max(k.inicio, +el.value));
    on("s_entrada", el => k.entradaTicks = Math.max(0, +el.value)); on("s_saida", el => k.saidaTicks = Math.max(0, +el.value));
  } else if (S.sel.track === "legenda") {
    on("l_texto", el => k.texto = el.value);
    on("l_inicio", el => k.inicio = Math.max(0, +el.value)); on("l_fim", el => k.fim = Math.max(k.inicio, +el.value));
    on("l_cor", el => k.cor = el.value); on("l_tam", el => k.tamanho = Math.max(0.5, +el.value));
  }
  const dup = $("b_dup"); if (dup) dup.onclick = duplicateSelected;
  const del = $("b_del"); if (del) del.onclick = deleteSelected;
  const ds = $("b_desel"); if (ds) ds.onclick = () => select(null);
}
function resortSel() { const k = selected(); sortKeys(S.doc); const list = S.sel.track === "camera" ? S.doc.camera : S.doc.atores[S.sel.track].chaves; S.sel.i = list.indexOf(k); S.t = k.t; }
// Atualiza só os números do inspetor (enquanto pilota ou arrasta), sem redesenhar.
function updateInspectorValues() {
  const k = selected(); if (!k || !S.sel) return;
  const setv = (id, v) => { const el = document.getElementById(id); if (el && document.activeElement !== el) el.value = round(v, 3); const n = document.getElementById(id + "_n"); if (n && document.activeElement !== n) n.value = round(v, 2); };
  if (S.sel.track === "camera") { setv("k_t", k.t); setv("k_x", k.pos[0]); setv("k_y", k.pos[1]); setv("k_z", k.pos[2]); setv("k_yaw", k.rot[0]); setv("k_pitch", k.rot[1]); setv("k_roll", k.rot[2]); setv("k_fov", k.fov); }
  else if (S.sel.track === "usuario" || S.sel.track === "alvo") { setv("k_t", k.t); setv("k_x", k.pos[0]); setv("k_y", k.pos[1]); setv("k_z", k.pos[2]); }
  else if (S.sel.track === "trecho") { setv("s_inicio", k.inicio); setv("s_fim", k.fim); }
  else if (S.sel.track === "legenda") { setv("l_inicio", k.inicio); setv("l_fim", k.fim); }
}
// Trocar a origem mantém a câmera no mesmo lugar do mundo.
function convertOrigin(next) {
  const s = SK[S.id];
  const before = sceneOrigin(S.id, S.doc);
  S.doc.origem = next;
  const after = sceneOrigin(S.id, S.doc), shift = sub(before, after);
  S.doc.camera.forEach(k => k.pos = add(k.pos, shift).map(x => round(x)));
  save(); pathDirty = true;
}

// ======================================================================================================
// Painel da esquerda
// ======================================================================================================
function buildSkillList() {
  const box = document.getElementById("skillList");
  box.innerHTML = "<h3>Skills com cutscene</h3>" + SKILL_IDS.map(id => {
    const s = SK[id], saved = store.get("cutscenes1:" + id);
    return `<button class="skill${id === S.id ? " sel" : ""}" data-id="${id}"><b>${esc(s.nome)}</b><span>${esc(s.poder)} · ${s.dur} ticks${saved ? ' · <span class="mod">editada</span>' : ""}</span></button>`;
  }).join("");
  box.querySelectorAll(".skill").forEach(b => b.onclick = () => loadSkill(b.dataset.id));
  document.getElementById("skillNote").textContent = SK[S.id].note;
}
function buildEvents() {
  document.getElementById("events").innerHTML = SK[S.id].events.map(([t, n]) => `<div><b>${t}</b><span>${esc(n)}</span></div>`).join("");
}

// ======================================================================================================
// Botões, teclado, modais
// ======================================================================================================
const $ = id => document.getElementById(id);
function updatePlayBtn() { $("tPlay").textContent = S.playing ? "❚❚ Pausar" : "▶ Tocar"; }
function setView(v) { S.view = v; $("vCam").classList.toggle("on", v === "cam"); $("vFree").classList.toggle("on", v === "free"); if (v === "free") { S.pilot = false; $("vPilot").classList.remove("on"); } orbit.enabled = v === "free"; attachGizmo(); }
$("vCam").onclick = () => setView("cam");
$("vFree").onclick = () => setView("free");
$("vPilot").onclick = () => { S.pilot = !S.pilot; if (S.pilot) { setView("cam"); S.playing = false; updatePlayBtn(); S.orig = false; $("vOrig").classList.remove("on"); toast("Pilotando: arraste, roda do mouse, WASD, Q/E"); } $("vPilot").classList.toggle("on", S.pilot); };
$("vOrig").onclick = () => { S.orig = !S.orig; $("vOrig").classList.toggle("on", S.orig); if (S.orig) { S.pilot = false; $("vPilot").classList.remove("on"); } };
$("tPlay").onclick = () => { S.playing = !S.playing; if (S.playing && S.t >= S.doc.duracaoTicks) S.t = 0; updatePlayBtn(); gizmo.detach(); };
$("tStart").onclick = () => { S.t = 0; attachGizmo(); };
$("tPrev").onclick = () => { S.t = Math.max(0, Math.round(S.t) - 1); attachGizmo(); };
$("tNext").onclick = () => { S.t = Math.min(S.doc.duracaoTicks, Math.round(S.t) + 1); attachGizmo(); };
$("speed").onchange = e => S.speed = +e.target.value;
$("tLoop").onclick = () => { S.loop = !S.loop; $("tLoop").classList.toggle("on", S.loop); };
$("tFit").onclick = fitTimeline;
$("kCam").onclick = () => addCameraKey();
$("kUsr").onclick = () => addActorKey("usuario");
$("kAlv").onclick = () => addActorKey("alvo");
$("kCut").onclick = addTrecho;
$("kLeg").onclick = addLegenda;
window.addEventListener("keydown", e => {
  if (e.target.matches("input,textarea,select")) return;
  keys[e.code] = true;
  if (S.pilot && ["KeyW", "KeyA", "KeyS", "KeyD", "Space", "KeyQ", "KeyE"].includes(e.code)) { e.preventDefault(); if (!e.repeat) pushUndo(); return; }
  if (e.code === "Space") { e.preventDefault(); $("tPlay").click(); }
  else if (e.code === "KeyK") addCameraKey();
  else if (e.code === "Delete" || e.code === "Backspace") deleteSelected();
  else if (e.code === "ArrowLeft") $("tPrev").click();
  else if (e.code === "ArrowRight") $("tNext").click();
  else if (e.code === "Home") $("tStart").click();
  else if (e.code === "KeyZ" && (e.ctrlKey || e.metaKey)) undo();
  else if (e.code === "Escape") select(null);
});
window.addEventListener("keyup", e => { keys[e.code] = false; if (S.pilot && !["ControlLeft"].includes(e.code)) { save(); renderInspector(); } });
window.addEventListener("blur", () => { for (const k in keys) keys[k] = false; });

let toastTimer = 0;
function toast(msg) { const el = $("toast"); el.textContent = msg; el.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 1800); }
function modal(head, body, actions) {
  $("mHead").innerHTML = head; $("mBody").innerHTML = body; $("mActs").innerHTML = "";
  actions.forEach(([label, fn, cls]) => { const b = document.createElement("button"); b.textContent = label; if (cls) b.className = cls; b.onclick = fn; $("mActs").appendChild(b); });
  $("modal").hidden = false;
}
const closeModal = () => $("modal").hidden = true;
$("modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });
$("btnExport").onclick = () => {
  const json = JSON.stringify(exportDoc(S.doc), null, 2), s = SK[S.id];
  modal(`<h2>Exportar · ${esc(s.nome)}</h2>`,
    `<p class="hint">Salve este texto num arquivo com o nome abaixo, dentro da pasta <b>config</b> do Minecraft (no <span class="kbd">gradlew runClient</span> é a pasta <b>run/config</b> do projeto). Crie a pasta <b>souls_cutscenes</b> se não existir. O mod lê o arquivo toda vez que a skill começa, então dá pra trocar com o jogo aberto.</p>
     <div class="path">config/souls_cutscenes/${esc(S.id)}.json</div>
     <p class="hint">Pra voltar pra cutscene original, apague o arquivo ou desmarque "Usar esta cutscene no jogo". Também pode me mandar esse JSON no chat que eu coloco dentro do mod.</p>
     <textarea id="exportText" readonly>${esc(json)}</textarea>`,
    [["Fechar", closeModal], ["Copiar JSON", () => { const ta = $("exportText"); const done = () => toast("JSON copiado"); try { navigator.clipboard.writeText(json).then(done, () => { ta.select(); toast("Selecionei o texto: aperte Ctrl+C"); }); } catch (e) { ta.select(); toast("Selecionei o texto: aperte Ctrl+C"); } }, "primary"]]);
};
$("btnImport").onclick = () => {
  modal(`<h2>Carregar JSON</h2>`, `<p class="hint">Cole um JSON souls-cutscene/1 (um que você exportou ou que eu mandei). Ele vai pra skill que estiver no campo "skill".</p><textarea id="importText" placeholder='{"formato": "souls-cutscene/1", ...}'></textarea>`,
    [["Cancelar", closeModal], ["Carregar", () => {
      try {
        const j = JSON.parse($("importText").value);
        const id = SK[j.skill] ? j.skill : S.id;
        pushUndo(); store.set("cutscenes1:" + id, JSON.stringify(normalize(j, id))); closeModal(); loadSkill(id); toast("Cutscene carregada");
      } catch (e) { toast("Esse texto não é um JSON válido: " + e.message); }
    }, "primary"]]);
};
$("btnReset").onclick = () => {
  modal(`<h2>Voltar pra câmera original?</h2>`, `<p class="hint">Apaga as suas mudanças nesta skill (${esc(SK[S.id].nome)}) e recria as chaves a partir da câmera que o mod usa hoje. Dá pra desfazer com Ctrl+Z enquanto a página estiver aberta.</p>`,
    [["Cancelar", closeModal], ["Voltar pro original", () => { pushUndo(); S.doc = defaultDoc(S.id); S.doc = normalize(S.doc, S.id); save(); closeModal(); S.sel = null; pathDirty = true; renderInspector(); buildSkillList(); toast("Câmera original restaurada"); }, "danger"]]);
};
$("btnHelp").onclick = () => {
  modal(`<h2>Como usar</h2>`, `<div class="sec" style="border:0;padding:0">
    <p class="hint"><b>1.</b> Escolha a skill na esquerda. Ela já abre com a câmera que o mod usa hoje, convertida em chaves (a cada 4 ticks), pra você partir dela.</p>
    <p class="hint"><b>2.</b> Toque (Espaço) e veja pela <b>Câmera da cutscene</b>. Use <b>Comparar com original</b> pra ver a de hoje.</p>
    <p class="hint"><b>3.</b> Pra mudar um plano: pare no tick, clique em <b>Pilotar câmera</b> e enquadre. Ou selecione uma chave e mexa nos números à direita. Na <b>Visão livre</b> dá pra arrastar a chave pela seta.</p>
    <p class="hint"><b>4.</b> <b>Seguir</b> faz a câmera andar junto com um personagem (bom pra quando o alvo voa). <b>Mirar</b> deixa a câmera sempre apontada pra ele.</p>
    <p class="hint"><b>5.</b> Os <b>trechos vermelhos</b> dizem quando a câmera é da cutscene. Entrada e saída suaves fazem a câmera deslizar da visão do jogador e voltar pra ela.</p>
    <p class="hint"><b>6.</b> Nas trilhas <b>Usuário</b> e <b>Alvo</b> você anima os personagens: deslocamento, virar e pose. "Somar" mexe por cima da animação da skill; "Substituir" troca a pose enquanto as chaves durarem.</p>
    <p class="hint"><b>7.</b> <b>Exportar pro mod</b> e salve em <b>config/souls_cutscenes/&lt;skill&gt;.json</b>. Pronto: na próxima vez que usar a skill, é a sua cutscene.</p>
    <p class="hint">Os personagens e efeitos da prévia são uma aproximação do que a skill faz, só pra dar referência de tempo e lugar. Tudo fica salvo neste navegador.</p></div>`, [["Entendi", closeModal, "primary"]]);
};

// ======================================================================================================
// Começo
// ======================================================================================================
window.__cut = { S, SK, cutCam, origCam, weight, curve, exportDoc };
const last = store.get("cutscenes1:last");
loadSkill(SK[last] ? last : "bills.destruction_bop");
resize();
setView("cam");
requestAnimationFrame(loop);
</script>
